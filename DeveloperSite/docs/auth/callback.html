<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Liftly - 認証中</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fafafa; }
    .msg { text-align: center; color: #333; }
    .err { color: #b91c1c; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="msg">
    <p id="status">アプリを開いています...</p>
    <p id="err" class="err" hidden></p>
  </div>
  <script>
    (function() {
      // Supabase がリダイレクトした際の query と fragment をそのままアプリのスキームへ渡す
      var scheme = 'com.fitnesslog.liftly';
      var host = 'auth';
      var path = '/callback';
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var params = new URLSearchParams(search);
      var hashParams = new URLSearchParams(hash.replace(/^#/, ''));

      // エラー時はアプリへ転送せず、画面に表示する（Google 認証が挟まれない原因の特定のため）
      var error = params.get('error') || hashParams.get('error');
      var errorDesc = params.get('error_description') || hashParams.get('error_description');
      if (error) {
        document.getElementById('status').textContent = '認証でエラーが返されました。';
        var errEl = document.getElementById('err');
        errEl.innerHTML = '<strong>' + (error || 'error') + '</strong><br>' + (errorDesc || '');
        errEl.hidden = false;
        return;
      }

      // code（PKCE）または fragment に access_token がある場合のみアプリへ転送
      var code = params.get('code');
      var hasToken = hashParams.has('access_token') || (hash && hash.indexOf('access_token=') >= 0);
      if (!code && !hasToken) {
        document.getElementById('status').textContent = '認証コールバック用のパラメータがありません。Google でログインがスキップされていないか、Supabase の Redirect URLs にこのページの URL が登録されているか確認してください。';
        return;
      }

      var appUrl = scheme + '://' + host + path + search + hash;
      try {
        window.location.replace(appUrl);
      } catch (e) {
        document.getElementById('status').textContent = 'アプリを開けませんでした。';
        document.getElementById('err').textContent = e.message || '';
        document.getElementById('err').hidden = false;
      }
    })();
  </script>
</body>
</html>
